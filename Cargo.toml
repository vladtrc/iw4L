[profile.release]
opt-level = 3
lto = false
codegen-units = 16
incremental = true
strip = "symbols"

[profile.play]
inherits = "release"

# The binary a sampler can read (`make bench-perf`). Same code as
# [profile.play], plus DWARF line tables (`debug = 1`) to name a frame and a
# frame pointer in every function (`-Cforce-frame-pointers=yes`, set by the
# recipe) so `--call-graph fp` can walk out of it. Strip is off so those line
# tables survive.
[profile.perf]
inherits = "play"
debug = 1
strip = "none"
