[package]
name = "bootstrap"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Composition root: assembles the bevy App for menu / map / play runs."

[features]
bevy-debug = ["bevy/debug", "bevy/track_location"]
# Bevy's own `tracing` spans, written as a Chrome trace beside the binary.
#
# Off by default and never on in a timed run: the subscriber costs the frame
# it measures. It exists because the spans inside bevy's render graph — the
# `queue_submit` around `RenderQueue::submit`, the ones inside
# `RenderContext::apply` — are the only place a submit can be timed from, and
# this runtime's own Perfetto capture does not contain them. A diagnostic run
# on this feature is what turns "the interval across bevy's submit set was
# long" into a statement about where the time went.
bevy-trace = ["bevy/trace", "bevy/trace_chrome"]

[dependencies]
bevy.workspace = true
assets.workspace = true
audio.workspace = true
console.workspace = true
diag.workspace = true
render.workspace = true
render_frontend.workspace = true
sim.workspace = true
net.workspace = true
ui.workspace = true
replay.workspace = true
session.workspace = true
bots = { path = "../bots" }
hud = { path = "../hud" }
gpu_probe.workspace = true
perf.workspace = true
sha2.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints]
workspace = true
