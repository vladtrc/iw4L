// Default controls — bind-id names follow the retail bind table.
// Host defaults, not a dump of retail config_mp.cfg.
// Edit and re-run `binddefaults`, or paste lines into the console.

bind w +forward
bind s +back
bind a +moveleft
bind d +moveright
bind SPACE +gostand
bind C +movedown
bind CTRL +prone
bind SHIFT +sprint

bind MOUSE1 +attack
bind MOUSE2 +toggleads_throw
bind MOUSE3 weapnext

bind R +reload
bind V +melee
bind E +activate
bind F +frag
bind G +smoke
bind TAB +scores

bind 2 +left
bind 3 +right
